name: Windows transport record
on:
  pull_request:
    branches: [main]
jobs:
  record:
    if: github.head_ref == 'diag/t6qyfa-win-record'
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: '3.14'
      - name: Configure fixture Git
        shell: pwsh
        run: |
          git config --global user.email 'ci@example.com'
          git config --global user.name 'CI'
          git config --global core.autocrlf false
          git --version
      - name: Install package
        run: python -m pip install '.[dev]'
      - name: Capture loopback transport records
        run: >-
          python -m pytest -q -rA tests/test_sources_transport.py
          -k "filtered_bundle_reaches_real_git_without_dropped_trust or hostile_insteadof_rewrite_does_not_deflect_the_literal_attempt"
