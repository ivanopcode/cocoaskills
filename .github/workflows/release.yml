name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  build:
    name: Build distributions
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.release.outputs.tag }}
      version: ${{ steps.release.outputs.version }}
      prerelease: ${{ steps.release.outputs.prerelease }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build tools
        run: python -m pip install --upgrade build twine

      - name: Resolve release route
        id: release
        run: python .github/scripts/release_contract.py resolve --tag "${{ github.ref_name }}"

      - name: Build wheel and sdist
        run: python -m build

      - name: Check metadata
        run: twine check dist/*

      - name: Verify tag, metadata, assets, and generate checksums
        run: >-
          python .github/scripts/release_contract.py verify-dist
          --tag "${{ steps.release.outputs.tag }}"
          --dist dist
          --write-checksums

      - name: Upload Python distributions
        uses: actions/upload-artifact@v4
        with:
          name: python-dist
          path: |
            dist/*.tar.gz
            dist/*.whl

      - name: Upload checksums
        uses: actions/upload-artifact@v4
        with:
          name: checksums
          path: dist/SHA256SUMS

  publish-testpypi:
    name: Publish to TestPyPI
    needs: build
    runs-on: ubuntu-latest
    if: needs.build.outputs.prerelease == 'true'
    environment: testpypi
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout release contract
        uses: actions/checkout@v4

      - name: Download distributions
        uses: actions/download-artifact@v4
        with:
          name: python-dist
          path: dist

      - name: Download checksums
        uses: actions/download-artifact@v4
        with:
          name: checksums
          path: dist

      - name: Reverify immutable distributions
        run: |
          python .github/scripts/release_contract.py verify-dist \
            --tag "${{ needs.build.outputs.tag }}" \
            --dist dist
          rm dist/SHA256SUMS

      - name: Publish to TestPyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
          packages-dir: dist/
          attestations: true

  publish-pypi:
    name: Publish to production PyPI and GitHub Releases
    needs: [build, publish-testpypi]
    runs-on: ubuntu-latest
    if: >-
      ${{ always() && needs.build.result == 'success' &&
          (needs.build.outputs.prerelease == 'false' ||
           needs.publish-testpypi.result == 'success') }}
    environment: pypi
    permissions:
      contents: write
      id-token: write
    steps:
      - name: Checkout release contract
        uses: actions/checkout@v4

      - name: Download distributions
        uses: actions/download-artifact@v4
        with:
          name: python-dist
          path: dist

      - name: Download checksums
        uses: actions/download-artifact@v4
        with:
          name: checksums
          path: dist

      - name: Reverify immutable distributions
        run: |
          python .github/scripts/release_contract.py verify-dist \
            --tag "${{ needs.build.outputs.tag }}" \
            --dist dist
          rm dist/SHA256SUMS

      - name: Publish exact release to production PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/
          attestations: true

      - name: Restore verified checksums for GitHub Release
        uses: actions/download-artifact@v4
        with:
          name: checksums
          path: dist

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          files: dist/*
          fail_on_unmatched_files: true
          generate_release_notes: true
          overwrite_files: false
          tag_name: ${{ needs.build.outputs.tag }}
          draft: ${{ needs.build.outputs.prerelease }}
          prerelease: ${{ needs.build.outputs.prerelease }}
          make_latest: ${{ needs.build.outputs.prerelease == 'true' && 'false' || 'true' }}

      - name: Publish GitHub prerelease after immutable asset upload
        if: needs.build.outputs.prerelease == 'true'
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.build.outputs.tag }}
          prerelease: true
          make_latest: false

      - name: Verify production publication and immutable GitHub assets
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: >-
          python .github/scripts/release_contract.py verify-published
          --tag "${{ needs.build.outputs.tag }}"
          --repo "${{ github.repository }}"

  bump-homebrew-tap:
    name: Bump Homebrew tap formula
    needs: [build, publish-pypi]
    runs-on: ubuntu-latest
    # publish-testpypi is skipped on stable releases, and a skipped job in the
    # transitive needs chain skips dependents unless the condition opts out of
    # the implicit success() with always(); require the direct needs
    # explicitly instead.
    if: >-
      ${{ always() && needs.build.result == 'success' &&
          needs.publish-pypi.result == 'success' &&
          needs.build.outputs.prerelease == 'false' }}
    permissions:
      contents: read
    steps:
      - name: Checkout release contract
        uses: actions/checkout@v4

      - name: Download checksums
        uses: actions/download-artifact@v4
        with:
          name: checksums
          path: dist

      - name: Checkout Homebrew tap
        uses: actions/checkout@v4
        with:
          repository: ${{ vars.HOMEBREW_TAP_REPOSITORY || 'ivanopcode/homebrew-csk' }}
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          path: homebrew-tap

      - name: Rewrite tap formula from verified checksums
        id: formula
        run: >-
          python .github/scripts/bump_homebrew_formula.py
          --tag "${{ needs.build.outputs.tag }}"
          --repo "${{ github.repository }}"
          --checksums dist/SHA256SUMS
          --formula homebrew-tap/Formula/cocoaskills.rb

      - name: Commit and push tap bump
        if: steps.formula.outputs.changed == 'true'
        working-directory: homebrew-tap
        env:
          RELEASE_TAG: ${{ needs.build.outputs.tag }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Formula/cocoaskills.rb
          git commit -m "Bump cocoaskills to ${RELEASE_TAG}"
          git push
