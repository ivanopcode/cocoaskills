name: Approval Windows diagnostic
on: pull_request
jobs:
  global-upgrade:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.14'
      - uses: actions/setup-go@v6
        with:
          go-version: '1.25.5'
          cache: false
      - run: python -m pip install -e ".[dev]"
      - run: python -m pytest -vv tests/test_shell_approvals.py::test_global_upgrade_auto_approves_final_env_paths
