name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      candidate_ref:
        description: >-
          Full 40-character relux-works/curator-spec revision holding the candidate
          conformance suite. Branches, tags, short hashes and placeholders are
          rejected. Must be supplied together with candidate_manifest_sha256.
          Leave empty to use the committed .github/ci/candidate-suite.json.
        required: false
        default: ""
      candidate_manifest_sha256:
        description: >-
          Expected sha256 of conformance/v1/manifest.json at candidate_ref. A
          mismatch aborts the run rather than silently re-baselining onto a
          different candidate.
        required: false
        default: ""
      candidate_protocol_version:
        description: >-
          Expected protocol_version declared by the candidate manifest. When set,
          a mismatch aborts the run.
        required: false
        default: ""

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  # The one committed released conformance-suite pin. Every default protocol
  # lane runs against this revision. The candidate suite never appears here; it
  # enters only through .github/ci/candidate-suite.json or the workflow_dispatch
  # inputs above, and never replaces this pin.
  #
  # 0ed5c691 is the v1.0.0-rc.9 release commit on relux-works/curator-spec
  # main, and it publishes the suite this manager qualified against on all
  # three runners. Advancing it is fail-closed by construction:
  # tests/test_protocol_conformance.py and tests/test_build_metadata.py
  # authenticate the released manifest digest before reading a single suite
  # byte, and the Windows shard verifier pins this revision too, so a
  # half-advanced pin goes red at collection rather than silently
  # re-baselining. The digest itself is deliberately NOT repeated here:
  # test_no_rc6_literal_survives_outside_the_declaration forbids the candidate
  # declaration's identity from appearing in this file, and since rc.9 publishes
  # the qualified candidate's bytes the two digests are now the same string.
  RELEASED_SUITE_PIN: 0ed5c691e9208eea52f21db2fc05e226ce3516fd

jobs:
  typecheck:
    name: Type check / mypy strict
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install package
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Run mypy
        run: python -m mypy

  build:
    name: Build artifacts
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install build twine

      - name: Build sdist and wheel
        run: python -m build

      - name: Verify metadata
        run: twine check dist/*

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  fast_ordinary:
    name: Fast ordinary / Python 3.14 on ${{ matrix.os }}
    if: github.event_name == 'pull_request'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Checkout Curator Protocol conformance suite
        uses: actions/checkout@v4
        with:
          repository: relux-works/curator-spec
          ref: ${{ env.RELEASED_SUITE_PIN }}
          path: protocol-spec

      - name: Set up Go 1.25.5
        uses: actions/setup-go@v7
        with:
          go-version: "1.25.5"
          cache: false

      - name: Set up Python 3.14
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          allow-prereleases: true

      - name: Configure git (POSIX)
        if: runner.os != 'Windows'
        run: |
          git config --global user.email "ci@example.com"
          git config --global user.name "CI"
          git config --global init.defaultBranch main

      - name: Configure git (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          git config --global user.email "ci@example.com"
          git config --global user.name "CI"
          git config --global init.defaultBranch main
          git config --global core.autocrlf false
          git config --global core.symlinks false

      - name: Install package
        run: |
          python -m pip install --upgrade pip
          python -m pip install ".[dev]"

      - name: Run fast ordinary tests
        env:
          CURATOR_CONFORMANCE_ROOT: ${{ github.workspace }}/protocol-spec/conformance/v1
        run: >-
          python -m pytest -v
          --ignore=tests/test_protocol_conformance.py
          --ignore=tests/test_go_build_e2e.py
          -n 4 --dist=loadfile
          --basetemp="${{ runner.temp }}/csk-ordinary"
          -o cache_dir="${{ runner.temp }}/csk-pytest-cache"

  fast_protocol:
    name: Fast protocol sentinels / Python 3.14 on ${{ matrix.os }}
    if: github.event_name == 'pull_request'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Checkout Curator Protocol conformance suite
        uses: actions/checkout@v4
        with:
          repository: relux-works/curator-spec
          ref: ${{ env.RELEASED_SUITE_PIN }}
          path: protocol-spec

      - name: Set up Python 3.14
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          allow-prereleases: true

      - name: Install package
        run: |
          python -m pip install --upgrade pip
          python -m pip install ".[dev]"

      - name: Collect protocol sentinel node IDs
        env:
          CURATOR_CONFORMANCE_ROOT: ${{ github.workspace }}/protocol-spec/conformance/v1
        run: >-
          python -m pytest --collect-only -q
          "@.github/ci/protocol-fast-nodeids.txt"
          > protocol-fast-nodeids.txt

      - name: Run protocol sentinels
        env:
          CURATOR_CONFORMANCE_ROOT: ${{ github.workspace }}/protocol-spec/conformance/v1
        run: >-
          python -m pytest -q
          "@.github/ci/protocol-fast-nodeids.txt"
          --junitxml=protocol-fast-results.xml

      - name: Upload protocol sentinel evidence
        uses: actions/upload-artifact@v4
        with:
          name: protocol-fast-${{ matrix.os }}-py314
          path: |
            protocol-fast-nodeids.txt
            protocol-fast-results.xml
          if-no-files-found: error

  fast_go_e2e:
    name: Fast Go E2E smoke / Python 3.14 on ${{ matrix.os }}
    if: >-
      github.event_name == 'pull_request' ||
      github.event_name == 'workflow_dispatch'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    env:
      # The candidate identity every step of this job reads: the resolver, the
      # authenticator and the pytest fixture that re-authenticates the root.
      # Empty on push and pull_request, where the committed declaration in
      # .github/ci/candidate-suite.json is the candidate.
      CANDIDATE_REF: ${{ inputs.candidate_ref }}
      CANDIDATE_MANIFEST_SHA256: ${{ inputs.candidate_manifest_sha256 }}
      CANDIDATE_PROTOCOL_VERSION: ${{ inputs.candidate_protocol_version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go 1.25.5
        uses: actions/setup-go@v7
        with:
          go-version: "1.25.5"
          cache: false

      - name: Set up Python 3.14
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          allow-prereleases: true

      - name: Resolve the candidate suite input
        id: candidate
        run: python .github/scripts/candidate_suite.py resolve

      - name: Checkout the resolved candidate suite
        uses: actions/checkout@v4
        with:
          repository: ${{ steps.candidate.outputs.repository }}
          ref: ${{ steps.candidate.outputs.revision }}
          path: protocol-spec-candidate

      - name: Configure git (POSIX)
        if: runner.os != 'Windows'
        run: |
          git config --global user.email "ci@example.com"
          git config --global user.name "CI"
          git config --global init.defaultBranch main

      - name: Configure git (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          git config --global user.email "ci@example.com"
          git config --global user.name "CI"
          git config --global init.defaultBranch main
          git config --global core.autocrlf false
          git config --global core.symlinks false

      - name: Install package
        run: |
          python -m pip install --upgrade pip
          python -m pip install ".[dev]"

      - name: Authenticate the candidate suite and record its identity
        run: >-
          python .github/scripts/candidate_suite.py record
          --checkout "${{ github.workspace }}/protocol-spec-candidate"
          --root "${{ github.workspace }}/protocol-spec-candidate/conformance/v1"
          --evidence candidate-suite-identity.txt

      - name: Require the candidate root to serve every declared consumer
        run: >-
          python .github/scripts/candidate_consumption.py require
          --root "${{ github.workspace }}/protocol-spec-candidate/conformance/v1"

      - name: Run the schema-8 candidate consumption suite
        env:
          CURATOR_CONFORMANCE_ROOT: ${{ github.workspace }}/protocol-spec-candidate/conformance/v1
          CSK_REQUIRE_FULL_CANDIDATE_ROOT: "1"
        run: >-
          python -m pytest -q tests/test_schema8_candidate_conformance.py
          --basetemp="${{ runner.temp }}/csk-schema8"
          --junitxml=csk-schema8-results.xml

      - name: Gate the declared schema-8 consumption cases
        run: >-
          python .github/scripts/candidate_consumption.py gate
          --results csk-schema8-results.xml
          --platform "${{ runner.os == 'Linux' && 'linux' || runner.os == 'macOS' && 'darwin' || 'windows' }}"

      - name: Collect Go E2E smoke node IDs
        env:
          CURATOR_CONFORMANCE_ROOT: ${{ github.workspace }}/protocol-spec-candidate/conformance/v1
          CSK_GO_V1_MANAGER_EXECUTABLE: csk
          CSK_GO_V1_GO_EXECUTABLE: go
          CSK_E2E_REQUIRED_PLATFORM: ${{ runner.os == 'macOS' && 'macos_native' || runner.os == 'Windows' && 'windows_native' || 'ubuntu_portable_fail_closed' }}
        run: >-
          python -m pytest --collect-only -q
          "@.github/ci/${{ runner.os == 'Linux' && 'go-e2e-ubuntu-smoke-nodeids.txt' || runner.os == 'macOS' && 'go-e2e-macos-worker-domain-nodeids.txt' || 'go-e2e-native-smoke-nodeids.txt' }}"
          -m "${{ runner.os == 'Linux' && 'csk_e2e_ubuntu' || 'csk_e2e_native' }}"
          > csk-e2e-smoke-nodeids.txt

      - name: Run Go E2E smoke selection
        env:
          CURATOR_CONFORMANCE_ROOT: ${{ github.workspace }}/protocol-spec-candidate/conformance/v1
          CSK_GO_V1_MANAGER_EXECUTABLE: csk
          CSK_GO_V1_GO_EXECUTABLE: go
          CSK_E2E_REQUIRED_PLATFORM: ${{ runner.os == 'macOS' && 'macos_native' || runner.os == 'Windows' && 'windows_native' || 'ubuntu_portable_fail_closed' }}
        run: >-
          python -m pytest -q
          "@.github/ci/${{ runner.os == 'Linux' && 'go-e2e-ubuntu-smoke-nodeids.txt' || runner.os == 'macOS' && 'go-e2e-macos-worker-domain-nodeids.txt' || 'go-e2e-native-smoke-nodeids.txt' }}"
          -m "${{ runner.os == 'Linux' && 'csk_e2e_ubuntu' || 'csk_e2e_native' }}"
          --basetemp="${{ runner.temp }}/csk-e2e-smoke"
          --junitxml=csk-e2e-smoke-results.xml

      - name: Upload Go E2E smoke evidence
        uses: actions/upload-artifact@v4
        with:
          name: csk-e2e-smoke-${{ matrix.os }}-py314
          path: |
            candidate-suite-identity.txt
            csk-schema8-results.xml
            csk-e2e-smoke-nodeids.txt
            csk-e2e-smoke-results.xml
          if-no-files-found: error

  fast_draft_sources:
    name: Fast draft sources / Python 3.14 on ${{ matrix.os }}
    if: github.event_name == 'pull_request'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve the draft sources suite pin
        id: suite
        shell: bash
        run: |
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          pin = json.load(open(".github/ci/draft-sources-suite.json"))
          print(f"repository={pin['repository']}")
          print(f"revision={pin['revision']}")
          PY

      - name: Checkout the draft sources suite
        uses: actions/checkout@v4
        with:
          repository: ${{ steps.suite.outputs.repository }}
          ref: ${{ steps.suite.outputs.revision }}
          path: protocol-spec-draft

      - name: Set up Python 3.14
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          allow-prereleases: true

      - name: Install package
        run: |
          python -m pip install --upgrade pip
          python -m pip install ".[dev]"

      - name: Run draft sources conformance
        env:
          CSK_DRAFT_SOURCES_SUITE_ROOT: ${{ github.workspace }}/protocol-spec-draft/conformance/skillfile-sources-v1
        run: >-
          python -m pytest -q tests/test_draft_sources_conformance.py
          --junitxml=draft-sources-results.xml

      - name: Prepare Windows selection test temp root
        if: runner.os == 'Windows'
        shell: bash
        run: mkdir -p "$RUNNER_TEMP/win-selection"

      - name: Run Windows schema-2 CLI selection tests
        if: runner.os == 'Windows'
        shell: bash
        run: >-
          python -m pytest -q
          tests/test_cli.py
          --basetemp="$RUNNER_TEMP/win-selection/cli"
          --junitxml=windows-selection-cli-results.xml

      - name: Run Windows schema-2 selector and snapshot tests
        if: runner.os == 'Windows'
        shell: bash
        env:
          CSK_DRAFT_SOURCES_SUITE_ROOT: ${{ github.workspace }}/protocol-spec-draft/conformance/skillfile-sources-v1
        run: >-
          python -m pytest -q
          tests/test_skillfile_v2_selection.py
          tests/test_package_snapshot.py
          --basetemp="$RUNNER_TEMP/win-selection/snapshot"
          --junitxml=windows-selection-snapshot-results.xml

      - name: Run Windows schema-2 snapshot store and audit tests
        if: runner.os == 'Windows'
        shell: bash
        env:
          CSK_DRAFT_SOURCES_SUITE_ROOT: ${{ github.workspace }}/protocol-spec-draft/conformance/skillfile-sources-v1
        run: >-
          python -m pytest -q
          tests/test_source_snapshot_store.py
          tests/test_source_audit.py
          --basetemp="$RUNNER_TEMP/win-selection/audit"
          --junitxml=windows-selection-audit-results.xml

      - name: Run Windows schema-2 runtime and install transaction tests
        if: runner.os == 'Windows'
        shell: bash
        run: >-
          python -m pytest -q
          tests/test_source_runtime.py
          tests/test_source_install_transactions.py
          --basetemp="$RUNNER_TEMP/win-selection/runtime"
          --junitxml=windows-selection-runtime-results.xml

      - name: Run Windows schema-2 boundary tests
        if: runner.os == 'Windows'
        shell: bash
        run: >-
          python -m pytest -q
          tests/test_selection_boundary_property.py
          tests/test_posix_selection_bound.py
          tests/test_windows_selection.py
          --basetemp="$RUNNER_TEMP/win-selection/boundary"
          --junitxml=windows-selection-boundary-results.xml

      - name: Run Windows R1 guard against legacy listing resolver
        id: r1_legacy_mutant
        if: runner.os == 'Windows'
        continue-on-error: true
        shell: bash
        env:
          CSK_WINDOWS_R1_LEGACY_RESOLVER: "1"
        run: >-
          python -m pytest -q
          tests/test_selection_boundary_property.py
          -k test_r1_setup_does_not_list_outside
          --basetemp="$RUNNER_TEMP/win-selection/r1-mutant"
          --junitxml=windows-selection-r1-mutant-results.xml

      - name: Verify Windows R1 legacy resolver mutant was rejected
        if: runner.os == 'Windows' && always()
        shell: bash
        env:
          R1_MUTANT_OUTCOME: ${{ steps.r1_legacy_mutant.outcome }}
        run: |
          test "$R1_MUTANT_OUTCOME" = "failure"
          python - <<'PY'
          import xml.etree.ElementTree as ET

          report = ET.parse("windows-selection-r1-mutant-results.xml")
          failures = report.findall(".//testcase/failure")
          assert len(failures) == 2, len(failures)
          assert all("outside_scans" in (failure.text or "") for failure in failures)
          PY

      - name: Run Windows CI workflow tests
        if: runner.os == 'Windows'
        shell: bash
        run: >-
          python -m pytest -q tests/test_ci_workflow.py
          --basetemp="$RUNNER_TEMP/win-selection/workflow"
          --junitxml=windows-selection-workflow-results.xml

      - name: Upload draft sources evidence
        uses: actions/upload-artifact@v4
        with:
          name: draft-sources-${{ matrix.os }}-py314
          path: draft-sources-results.xml
          if-no-files-found: error

      - name: Upload Windows selection evidence
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: windows-selection-${{ matrix.os }}-py314
          path: windows-selection-*-results.xml
          if-no-files-found: error

  floor_syntax:
    name: Floor syntax / requires-python floor on ubuntu-latest
    # The Fast lane runs only Python 3.14, so a construct that parses there
    # but not on the declared floor (requires-python) reaches main unseen;
    # BUG-260917-3txerf was exactly that shape (PEP 701 f-strings). This job
    # compiles the package and the tests with the real floor interpreter on
    # every pull request. It is a syntax gate, not a second test matrix: one
    # runner, seconds of compile, no install, no tests. A grammar check on a
    # newer interpreter is NOT a substitute: ast.parse(feature_version=(3, 11))
    # does not re-impose the old f-string rule, so only the floor
    # interpreter itself can see this class. The compile step is
    # self-verifying: it fails closed unless the interpreter running it
    # reports the resolved FLOOR, so wiring drift that falls through to the
    # runner-default interpreter cannot go green.
    # Hardened by TASK-260918-16r0fm against the deliberate-edit class
    # (BUG-260917-3txerf rev-2 findings F3/F4): the compile step is exactly
    # one command running one committed gate script
    # (.github/scripts/floor_gate.py), so the check and the compile share
    # one process and its exit status IS the step status; the job and
    # per-step shapes are pinned as exact key whitelists in
    # tests/test_ci_workflow.py; and each target is proved present by a
    # named sentinel before compiling, because compileall exits 0 on an
    # unlistable target ("Can't list" is treated as empty).
    # Revision 2 closes the sibling surfaces: the gate resolves the floor
    # from pyproject.toml itself through the shared committed resolver
    # (.github/scripts/floor_resolve.py), the resolve step's run is pinned
    # whole exactly like the compile step's, the compile step declares
    # shell and isolated mode explicitly, the workflow-level surfaces are
    # pinned, and every target directory is proved listable by a walk.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve the floor Python from requires-python
        id: floor
        # The floor value has exactly one author:
        # .github/scripts/floor_resolve.py. The gate resolves through that
        # same file and fails closed unless the resolved floor equals the
        # running interpreter, so this step's run value is one command with
        # no shell around it -- no heredoc, no redirect, no text for an
        # extra line, a pipe, or an echo to hide in. The script appends
        # version=<floor> to $GITHUB_OUTPUT itself. Plain-regex read of
        # pyproject.toml so this runs on any preinstalled python3 (no
        # tomllib needed); scoped to [project]; fails closed without a >=
        # bound, so raising the floor moves this gate with it.
        run: python3 .github/scripts/floor_resolve.py

      - name: Set up floor Python ${{ steps.floor.outputs.version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ steps.floor.outputs.version }}

      - name: Compile the package on the floor interpreter
        # One process, one command: the gate script resolves the floor from
        # pyproject.toml itself, cross-checks FLOOR against it, proves each
        # target present via a named sentinel read and listable via a walk,
        # then compiles every target, exiting non-zero on any failure. Its
        # exit status IS the step status: there is no second command, no
        # between for a PATH change, and no shell -e dependence, so exit 0,
        # set +e, shell overrides and continue-on-error cannot separate the
        # check from the compile. The shell is declared explicitly so no
        # workflow-level default can substitute it, and -I keeps the gate
        # immune to inherited PYTHON* variables and smuggled modules.
        # Deliberately compile-only: it cannot see runtime-only
        # incompatibilities (a 3.12+ API that parses on the floor but fails
        # when called), which remain the Merge version matrix's job.
        shell: bash
        env:
          FLOOR: ${{ steps.floor.outputs.version }}
        run: python -I .github/scripts/floor_gate.py

  fast:
    name: fast
    if: ${{ always() && github.event_name == 'pull_request' }}
    needs: [typecheck, build, fast_ordinary, fast_protocol, fast_go_e2e, fast_draft_sources, floor_syntax]
    runs-on: ubuntu-latest
    steps:
      - name: Require every fast child
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: |
          python - <<'PY'
          import json
          import os

          expected = {"typecheck", "build", "fast_ordinary", "fast_protocol", "fast_go_e2e", "fast_draft_sources", "floor_syntax"}
          actual = json.loads(os.environ["NEEDS_JSON"])
          if set(actual) != expected:
              raise SystemExit(f"required CI child mismatch: expected={sorted(expected)} actual={sorted(actual)}")
          bad = {name: value.get("result") for name, value in actual.items() if value.get("result") != "success"}
          if bad:
              raise SystemExit(f"required CI children did not succeed: {bad}")
          PY

  merge_ordinary:
    name: Merge ordinary / Python ${{ matrix.python-version }} on ${{ matrix.os }}
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Checkout Curator Protocol conformance suite
        uses: actions/checkout@v4
        with:
          repository: relux-works/curator-spec
          ref: ${{ env.RELEASED_SUITE_PIN }}
          path: protocol-spec

      - name: Set up Go 1.25.5
        uses: actions/setup-go@v7
        with:
          go-version: "1.25.5"
          cache: false

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          allow-prereleases: true

      - name: Configure git (POSIX)
        if: runner.os != 'Windows'
        run: |
          git config --global user.email "ci@example.com"
          git config --global user.name "CI"
          git config --global init.defaultBranch main

      - name: Configure git (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          git config --global user.email "ci@example.com"
          git config --global user.name "CI"
          git config --global init.defaultBranch main
          git config --global core.autocrlf false
          git config --global core.symlinks false

      - name: Install package
        run: |
          python -m pip install --upgrade pip
          python -m pip install ".[dev]"

      - name: Run full ordinary tests
        env:
          CURATOR_CONFORMANCE_ROOT: ${{ github.workspace }}/protocol-spec/conformance/v1
        run: >-
          python -m pytest -v
          --ignore=tests/test_protocol_conformance.py
          --ignore=tests/test_go_build_e2e.py
          -n 4 --dist=loadfile
          --basetemp="${{ runner.temp }}/csk-ordinary"
          -o cache_dir="${{ runner.temp }}/csk-pytest-cache"

  merge_protocol:
    name: Merge protocol / Python 3.14 / ${{ matrix.label }}
    # Reachable through workflow_dispatch as well, so the fail-closed shard
    # verifier can be exercised on a branch before the change is merged. It runs
    # nowhere else, and drift in an audited file used to surface only after a
    # push to main had already turned it red.
    if: >-
      (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
      github.event_name == 'workflow_dispatch'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            label: ubuntu-full
            shard: full
            temp_tag: full
            timeout_minutes: 360
          - os: macos-latest
            label: macos-full
            shard: full
            temp_tag: full
            timeout_minutes: 360
          - os: windows-latest
            label: windows-p00-contract-and-registry
            shard: p00-contract-and-registry
            temp_tag: p00
            timeout_minutes: 5
          - os: windows-latest
            label: windows-p01-lifecycle-cached-baseline
            shard: p01-lifecycle-cached-baseline
            temp_tag: p01
            timeout_minutes: 30
          - os: windows-latest
            label: windows-p02-lifecycle-sabotage-a
            shard: p02-lifecycle-sabotage-a
            temp_tag: p02
            timeout_minutes: 45
          - os: windows-latest
            label: windows-p03-lifecycle-sabotage-b
            shard: p03-lifecycle-sabotage-b
            temp_tag: p03
            timeout_minutes: 45
          - os: windows-latest
            label: windows-p04-lifecycle-sabotage-c
            shard: p04-lifecycle-sabotage-c
            temp_tag: p04
            timeout_minutes: 45
          - os: windows-latest
            label: windows-p05-lifecycle-sabotage-d
            shard: p05-lifecycle-sabotage-d
            temp_tag: p05
            timeout_minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Checkout Curator Protocol conformance suite
        uses: actions/checkout@v4
        with:
          repository: relux-works/curator-spec
          ref: ${{ env.RELEASED_SUITE_PIN }}
          path: protocol-spec

      - name: Set up Go 1.25.5
        uses: actions/setup-go@v7
        with:
          go-version: "1.25.5"
          cache: false

      - name: Set up Python 3.14
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          allow-prereleases: true

      - name: Configure git (POSIX)
        if: runner.os != 'Windows'
        run: |
          git config --global user.email "ci@example.com"
          git config --global user.name "CI"
          git config --global init.defaultBranch main

      - name: Configure git (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          git config --global user.email "ci@example.com"
          git config --global user.name "CI"
          git config --global init.defaultBranch main
          git config --global core.autocrlf false
          git config --global core.symlinks false

      - name: Normalize Windows source checkout
        if: runner.os == 'Windows'
        shell: pwsh
        # Checkout runs before the final Windows git policy is applied. Rewrite
        # tracked bytes under that policy so checkout-time CRLF conversions do
        # not make the pristine commit appear dirty to the fail-closed verifier.
        run: git reset --hard HEAD

      - name: Install package
        run: |
          python -m pip install --upgrade pip
          python -m pip install ".[dev]"

      - name: Relocate Windows protocol checkout and create evidence directory
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Move-Item -LiteralPath "${{ github.workspace }}/protocol-spec" -Destination "${{ runner.temp }}/protocol-spec"
          New-Item -ItemType Directory -Force -Path "${{ runner.temp }}/protocol-${{ matrix.temp_tag }}" | Out-Null

      - name: Run full protocol conformance suite
        if: runner.os != 'Windows'
        timeout-minutes: ${{ matrix.timeout_minutes }}
        env:
          CURATOR_CONFORMANCE_ROOT: ${{ github.workspace }}/protocol-spec/conformance/v1
        run: >-
          python -m pytest -v tests/test_protocol_conformance.py
          --basetemp="${{ runner.temp }}/csk-protocol-full"
          -o cache_dir="${{ runner.temp }}/csk-protocol-full-cache"

      - name: Collect canonical Windows protocol inventory
        if: runner.os == 'Windows'
        env:
          CURATOR_CONFORMANCE_ROOT: ${{ runner.temp }}/protocol-spec/conformance/v1
        run: >-
          python -m pytest --collect-only -q tests/test_protocol_conformance.py
          > "${{ runner.temp }}/protocol-${{ matrix.temp_tag }}/collected-nodeids.txt"

      - name: Verify and select deterministic Windows protocol shard
        if: runner.os == 'Windows'
        run: >-
          python .research/TASK-260803-2ol7ok_verify-protocol-shards.py
          --classification .research/TASK-260803-2ol7ok_protocol-isolation-classification.json
          --manifest .research/TASK-260803-2ol7ok_protocol-shards.json
          --collected "${{ runner.temp }}/protocol-${{ matrix.temp_tag }}/collected-nodeids.txt"
          --source-checkout .
          --protocol-checkout "${{ runner.temp }}/protocol-spec"
          --shard-id "${{ matrix.shard }}"
          --nodeids-out "${{ runner.temp }}/protocol-${{ matrix.temp_tag }}/shard-nodeids.txt"
          > "${{ runner.temp }}/protocol-${{ matrix.temp_tag }}/verification.json"

      - name: Run deterministic Windows protocol shard
        if: runner.os == 'Windows'
        timeout-minutes: ${{ matrix.timeout_minutes }}
        env:
          CURATOR_CONFORMANCE_ROOT: ${{ runner.temp }}/protocol-spec/conformance/v1
        run: >-
          python -m pytest -vv "@${{ runner.temp }}/protocol-${{ matrix.temp_tag }}/shard-nodeids.txt"
          --basetemp="${{ runner.temp }}/csk-${{ matrix.temp_tag }}"
          -o cache_dir="${{ runner.temp }}/csk-cache-${{ matrix.temp_tag }}"
          --junitxml="${{ runner.temp }}/protocol-${{ matrix.temp_tag }}/results.xml"

      - name: Upload Windows protocol shard evidence
        if: ${{ always() && runner.os == 'Windows' }}
        uses: actions/upload-artifact@v4
        with:
          name: protocol-${{ matrix.shard }}-windows-py314
          path: |
            ${{ runner.temp }}/protocol-${{ matrix.temp_tag }}/collected-nodeids.txt
            ${{ runner.temp }}/protocol-${{ matrix.temp_tag }}/shard-nodeids.txt
            ${{ runner.temp }}/protocol-${{ matrix.temp_tag }}/verification.json
            ${{ runner.temp }}/protocol-${{ matrix.temp_tag }}/results.xml
          if-no-files-found: error

  merge_go_e2e:
    name: Merge Go E2E / Python 3.14 on ${{ matrix.os }}
    if: >-
      (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
      github.event_name == 'workflow_dispatch'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    env:
      # The candidate identity every step of this job reads: the resolver, the
      # authenticator and the pytest fixture that re-authenticates the root.
      # Empty on push and pull_request, where the committed declaration in
      # .github/ci/candidate-suite.json is the candidate.
      CANDIDATE_REF: ${{ inputs.candidate_ref }}
      CANDIDATE_MANIFEST_SHA256: ${{ inputs.candidate_manifest_sha256 }}
      CANDIDATE_PROTOCOL_VERSION: ${{ inputs.candidate_protocol_version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go 1.25.5
        uses: actions/setup-go@v7
        with:
          go-version: "1.25.5"
          cache: false

      - name: Set up Python 3.14
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          allow-prereleases: true

      - name: Resolve the candidate suite input
        id: candidate
        run: python .github/scripts/candidate_suite.py resolve

      - name: Checkout the resolved candidate suite
        uses: actions/checkout@v4
        with:
          repository: ${{ steps.candidate.outputs.repository }}
          ref: ${{ steps.candidate.outputs.revision }}
          path: protocol-spec-candidate

      - name: Configure git (POSIX)
        if: runner.os != 'Windows'
        run: |
          git config --global user.email "ci@example.com"
          git config --global user.name "CI"
          git config --global init.defaultBranch main

      - name: Configure git (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          git config --global user.email "ci@example.com"
          git config --global user.name "CI"
          git config --global init.defaultBranch main
          git config --global core.autocrlf false
          git config --global core.symlinks false

      - name: Install package
        run: |
          python -m pip install --upgrade pip
          python -m pip install ".[dev]"

      - name: Authenticate the candidate suite and record its identity
        run: >-
          python .github/scripts/candidate_suite.py record
          --checkout "${{ github.workspace }}/protocol-spec-candidate"
          --root "${{ github.workspace }}/protocol-spec-candidate/conformance/v1"
          --evidence candidate-suite-identity.txt

      - name: Require the candidate root to serve every declared consumer
        run: >-
          python .github/scripts/candidate_consumption.py require
          --root "${{ github.workspace }}/protocol-spec-candidate/conformance/v1"

      - name: Run the schema-8 candidate consumption suite
        env:
          CURATOR_CONFORMANCE_ROOT: ${{ github.workspace }}/protocol-spec-candidate/conformance/v1
          CSK_REQUIRE_FULL_CANDIDATE_ROOT: "1"
        run: >-
          python -m pytest -q tests/test_schema8_candidate_conformance.py
          --basetemp="${{ runner.temp }}/csk-schema8"
          --junitxml=csk-schema8-results.xml

      - name: Gate the declared schema-8 consumption cases
        run: >-
          python .github/scripts/candidate_consumption.py gate
          --results csk-schema8-results.xml
          --platform "${{ runner.os == 'Linux' && 'linux' || runner.os == 'macOS' && 'darwin' || 'windows' }}"

      - name: Collect accepted Go E2E node IDs
        env:
          CURATOR_CONFORMANCE_ROOT: ${{ github.workspace }}/protocol-spec-candidate/conformance/v1
          CSK_GO_V1_MANAGER_EXECUTABLE: csk
          CSK_GO_V1_GO_EXECUTABLE: go
          CSK_E2E_REQUIRED_PLATFORM: ${{ runner.os == 'macOS' && 'macos_native' || runner.os == 'Windows' && 'windows_native' || 'ubuntu_portable_fail_closed' }}
        run: >-
          python -m pytest --collect-only -q tests/test_go_build_e2e.py
          -m "${{ runner.os == 'Linux' && 'csk_e2e_ubuntu' || 'csk_e2e_native' }}"
          > csk-e2e-nodeids.txt

      - name: Run accepted Go E2E selection
        env:
          CURATOR_CONFORMANCE_ROOT: ${{ github.workspace }}/protocol-spec-candidate/conformance/v1
          CSK_GO_V1_MANAGER_EXECUTABLE: csk
          CSK_GO_V1_GO_EXECUTABLE: go
          CSK_E2E_REQUIRED_PLATFORM: ${{ runner.os == 'macOS' && 'macos_native' || runner.os == 'Windows' && 'windows_native' || 'ubuntu_portable_fail_closed' }}
        run: >-
          python -m pytest -q tests/test_go_build_e2e.py
          -m "${{ runner.os == 'Linux' && 'csk_e2e_ubuntu' || 'csk_e2e_native' }}"
          --basetemp="${{ runner.temp }}/csk-e2e"
          --junitxml=csk-e2e-results.xml

      - name: Upload accepted Go E2E evidence
        uses: actions/upload-artifact@v4
        with:
          name: csk-e2e-${{ matrix.os }}-py314
          path: |
            candidate-suite-identity.txt
            csk-schema8-results.xml
            csk-e2e-nodeids.txt
            csk-e2e-results.xml
          if-no-files-found: error

  merge_draft_sources:
    name: Merge draft sources / Python 3.14 on ${{ matrix.os }}
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve the draft sources suite pin
        id: suite
        run: |
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          pin = json.load(open(".github/ci/draft-sources-suite.json"))
          print(f"repository={pin['repository']}")
          print(f"revision={pin['revision']}")
          PY

      - name: Checkout the draft sources suite
        uses: actions/checkout@v4
        with:
          repository: ${{ steps.suite.outputs.repository }}
          ref: ${{ steps.suite.outputs.revision }}
          path: protocol-spec-draft

      - name: Set up Python 3.14
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          allow-prereleases: true

      - name: Install package
        run: |
          python -m pip install --upgrade pip
          python -m pip install ".[dev]"

      - name: Run draft sources conformance
        env:
          CSK_DRAFT_SOURCES_SUITE_ROOT: ${{ github.workspace }}/protocol-spec-draft/conformance/skillfile-sources-v1
        run: >-
          python -m pytest -q tests/test_draft_sources_conformance.py
          --junitxml=draft-sources-results.xml

      - name: Upload draft sources evidence
        uses: actions/upload-artifact@v4
        with:
          name: draft-sources-${{ matrix.os }}-py314
          path: draft-sources-results.xml
          if-no-files-found: error

  merge:
    name: merge
    if: ${{ always() && github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    needs: [typecheck, build, merge_ordinary, merge_protocol, merge_go_e2e, merge_draft_sources]
    runs-on: ubuntu-latest
    steps:
      - name: Require every merge child
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: |
          python - <<'PY'
          import json
          import os

          expected = {"typecheck", "build", "merge_ordinary", "merge_protocol", "merge_go_e2e", "merge_draft_sources"}
          actual = json.loads(os.environ["NEEDS_JSON"])
          if set(actual) != expected:
              raise SystemExit(f"required CI child mismatch: expected={sorted(expected)} actual={sorted(actual)}")
          bad = {name: value.get("result") for name, value in actual.items() if value.get("result") != "success"}
          if bad:
              raise SystemExit(f"required CI children did not succeed: {bad}")
          PY
