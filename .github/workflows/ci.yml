name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Tests / Python ${{ matrix.python-version }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Checkout Curator Protocol conformance suite
        uses: actions/checkout@v4
        with:
          repository: relux-works/curator-spec
          ref: 0c81c1f8d5321d822be2a2817b05aea03e656e15
          path: protocol-spec

      - name: Checkout caller-supplied rc.6 candidate
        if: matrix.python-version == '3.11'
        uses: actions/checkout@v4
        with:
          repository: relux-works/curator-spec
          ref: ${{ vars.CSK_E2E_CURATOR_SPEC_SHA }}
          path: protocol-spec-candidate

      - name: Set up Go 1.25.5
        uses: actions/setup-go@v7
        with:
          go-version: "1.25.5"
          cache: false

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          allow-prereleases: true

      - name: Configure git (POSIX)
        if: runner.os != 'Windows'
        run: |
          git config --global user.email "ci@example.com"
          git config --global user.name "CI"
          git config --global init.defaultBranch main

      - name: Configure git (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          git config --global user.email "ci@example.com"
          git config --global user.name "CI"
          git config --global init.defaultBranch main
          git config --global core.autocrlf false
          git config --global core.symlinks false

      - name: Install package
        run: |
          python -m pip install --upgrade pip
          python -m pip install ".[dev]"

      - name: Authenticate caller-supplied rc.6 candidate
        if: matrix.python-version == '3.11'
        env:
          CANDIDATE_CHECKOUT: ${{ github.workspace }}/protocol-spec-candidate
          CURATOR_CONFORMANCE_ROOT: ${{ github.workspace }}/protocol-spec-candidate/conformance/v1
        run: >-
          python -c "import hashlib, os, pathlib, subprocess;
          checkout=pathlib.Path(os.environ['CANDIDATE_CHECKOUT']);
          root=pathlib.Path(os.environ['CURATOR_CONFORMANCE_ROOT']);
          head=subprocess.run(['git','-C',str(checkout),'rev-parse','HEAD'],check=True,text=True,capture_output=True).stdout.strip();
          digest=hashlib.sha256((root/'manifest.json').read_bytes()).hexdigest();
          assert head == '432eb2ee1fe2d6b271e37269f867c8851c325539', head;
          assert digest == '12e58b82579645ba1ccafba49d3e2dd3216005ddf37ae63c68a9fafd46773071', digest"

      - name: Run ordinary tests
        env:
          CURATOR_CONFORMANCE_ROOT: ${{ github.workspace }}/protocol-spec/conformance/v1
        run: >-
          python -m pytest -v
          --ignore=tests/test_protocol_conformance.py
          --ignore=tests/test_go_build_e2e.py

      - name: Run protocol conformance suite
        if: matrix.python-version == '3.11'
        env:
          CURATOR_CONFORMANCE_ROOT: ${{ github.workspace }}/protocol-spec/conformance/v1
        run: python -m pytest -v tests/test_protocol_conformance.py

      - name: Collect accepted Go E2E node IDs
        if: matrix.python-version == '3.11'
        env:
          CURATOR_CONFORMANCE_ROOT: ${{ github.workspace }}/protocol-spec-candidate/conformance/v1
          CSK_GO_V1_MANAGER_EXECUTABLE: csk
          CSK_GO_V1_GO_EXECUTABLE: go
          CSK_E2E_REQUIRED_PLATFORM: ${{ runner.os == 'macOS' && 'macos_native' || runner.os == 'Windows' && 'windows_native' || 'ubuntu_portable_fail_closed' }}
        run: >-
          python -m pytest --collect-only -q tests/test_go_build_e2e.py
          -m "${{ runner.os == 'Linux' && 'csk_e2e_ubuntu' || 'csk_e2e_native' }}"
          > csk-e2e-nodeids.txt

      - name: Run accepted Go E2E selection
        if: matrix.python-version == '3.11'
        env:
          CURATOR_CONFORMANCE_ROOT: ${{ github.workspace }}/protocol-spec-candidate/conformance/v1
          CSK_GO_V1_MANAGER_EXECUTABLE: csk
          CSK_GO_V1_GO_EXECUTABLE: go
          CSK_E2E_REQUIRED_PLATFORM: ${{ runner.os == 'macOS' && 'macos_native' || runner.os == 'Windows' && 'windows_native' || 'ubuntu_portable_fail_closed' }}
        run: >-
          python -m pytest -q tests/test_go_build_e2e.py
          -m "${{ runner.os == 'Linux' && 'csk_e2e_ubuntu' || 'csk_e2e_native' }}"
          --basetemp="${{ runner.temp }}/csk-e2e"
          --junitxml=csk-e2e-results.xml

      - name: Upload accepted Go E2E evidence
        if: matrix.python-version == '3.11'
        uses: actions/upload-artifact@v4
        with:
          name: csk-e2e-${{ matrix.os }}-py311
          path: |
            csk-e2e-nodeids.txt
            csk-e2e-results.xml
          if-no-files-found: error

  typecheck:
    name: Type check / mypy strict
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install package
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Run mypy
        run: python -m mypy

  build:
    name: Build artifacts
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install build twine

      - name: Build sdist and wheel
        run: python -m build

      - name: Verify metadata
        run: twine check dist/*

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          if-no-files-found: error
