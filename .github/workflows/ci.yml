name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      candidate_ref:
        description: >-
          Full 40-character relux-works/curator-spec revision holding the candidate
          conformance suite. Branches, tags, short hashes and placeholders are
          rejected. Must be supplied together with candidate_manifest_sha256.
          Leave empty to use the committed .github/ci/candidate-suite.json.
        required: false
        default: ""
      candidate_manifest_sha256:
        description: >-
          Expected sha256 of conformance/v1/manifest.json at candidate_ref. A
          mismatch aborts the run rather than silently re-baselining onto a
          different candidate.
        required: false
        default: ""
      candidate_protocol_version:
        description: >-
          Expected protocol_version declared by the candidate manifest. When set,
          a mismatch aborts the run.
        required: false
        default: ""

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  # The one committed released conformance-suite pin. Every default protocol
  # lane runs against this revision. The candidate suite never appears here; it
  # enters only through .github/ci/candidate-suite.json or the workflow_dispatch
  # inputs above, and never replaces this pin.
  RELEASED_SUITE_PIN: 0c81c1f8d5321d822be2a2817b05aea03e656e15

jobs:
  typecheck:
    name: Type check / mypy strict
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install package
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Run mypy
        run: python -m mypy

  build:
    name: Build artifacts
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install build twine

      - name: Build sdist and wheel
        run: python -m build

      - name: Verify metadata
        run: twine check dist/*

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  fast_ordinary:
    name: Fast ordinary / Python 3.14 on ${{ matrix.os }}
    if: github.event_name == 'pull_request'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Checkout Curator Protocol conformance suite
        uses: actions/checkout@v4
        with:
          repository: relux-works/curator-spec
          ref: ${{ env.RELEASED_SUITE_PIN }}
          path: protocol-spec

      - name: Set up Go 1.25.5
        uses: actions/setup-go@v7
        with:
          go-version: "1.25.5"
          cache: false

      - name: Set up Python 3.14
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          allow-prereleases: true

      - name: Configure git (POSIX)
        if: runner.os != 'Windows'
        run: |
          git config --global user.email "ci@example.com"
          git config --global user.name "CI"
          git config --global init.defaultBranch main

      - name: Configure git (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          git config --global user.email "ci@example.com"
          git config --global user.name "CI"
          git config --global init.defaultBranch main
          git config --global core.autocrlf false
          git config --global core.symlinks false

      - name: Install package
        run: |
          python -m pip install --upgrade pip
          python -m pip install ".[dev]"

      - name: Run fast ordinary tests
        env:
          CURATOR_CONFORMANCE_ROOT: ${{ github.workspace }}/protocol-spec/conformance/v1
        run: >-
          python -m pytest -v
          --ignore=tests/test_protocol_conformance.py
          --ignore=tests/test_go_build_e2e.py
          -n 4 --dist=loadfile
          --basetemp="${{ runner.temp }}/csk-ordinary"
          -o cache_dir="${{ runner.temp }}/csk-pytest-cache"

  fast_protocol:
    name: Fast protocol sentinels / Python 3.14 on ${{ matrix.os }}
    if: github.event_name == 'pull_request'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Checkout Curator Protocol conformance suite
        uses: actions/checkout@v4
        with:
          repository: relux-works/curator-spec
          ref: ${{ env.RELEASED_SUITE_PIN }}
          path: protocol-spec

      - name: Set up Python 3.14
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          allow-prereleases: true

      - name: Install package
        run: |
          python -m pip install --upgrade pip
          python -m pip install ".[dev]"

      - name: Collect protocol sentinel node IDs
        env:
          CURATOR_CONFORMANCE_ROOT: ${{ github.workspace }}/protocol-spec/conformance/v1
        run: >-
          python -m pytest --collect-only -q
          "@.github/ci/protocol-fast-nodeids.txt"
          > protocol-fast-nodeids.txt

      - name: Run protocol sentinels
        env:
          CURATOR_CONFORMANCE_ROOT: ${{ github.workspace }}/protocol-spec/conformance/v1
        run: >-
          python -m pytest -q
          "@.github/ci/protocol-fast-nodeids.txt"
          --junitxml=protocol-fast-results.xml

      - name: Upload protocol sentinel evidence
        uses: actions/upload-artifact@v4
        with:
          name: protocol-fast-${{ matrix.os }}-py314
          path: |
            protocol-fast-nodeids.txt
            protocol-fast-results.xml
          if-no-files-found: error

  fast_go_e2e:
    name: Fast Go E2E smoke / Python 3.14 on ${{ matrix.os }}
    if: >-
      github.event_name == 'pull_request' ||
      github.event_name == 'workflow_dispatch'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    env:
      # The candidate identity every step of this job reads: the resolver, the
      # authenticator and the pytest fixture that re-authenticates the root.
      # Empty on push and pull_request, where the committed declaration in
      # .github/ci/candidate-suite.json is the candidate.
      CANDIDATE_REF: ${{ inputs.candidate_ref }}
      CANDIDATE_MANIFEST_SHA256: ${{ inputs.candidate_manifest_sha256 }}
      CANDIDATE_PROTOCOL_VERSION: ${{ inputs.candidate_protocol_version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go 1.25.5
        uses: actions/setup-go@v7
        with:
          go-version: "1.25.5"
          cache: false

      - name: Set up Python 3.14
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          allow-prereleases: true

      - name: Resolve the candidate suite input
        id: candidate
        run: python .github/scripts/candidate_suite.py resolve

      - name: Checkout the resolved candidate suite
        uses: actions/checkout@v4
        with:
          repository: ${{ steps.candidate.outputs.repository }}
          ref: ${{ steps.candidate.outputs.revision }}
          path: protocol-spec-candidate

      - name: Configure git (POSIX)
        if: runner.os != 'Windows'
        run: |
          git config --global user.email "ci@example.com"
          git config --global user.name "CI"
          git config --global init.defaultBranch main

      - name: Configure git (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          git config --global user.email "ci@example.com"
          git config --global user.name "CI"
          git config --global init.defaultBranch main
          git config --global core.autocrlf false
          git config --global core.symlinks false

      - name: Install package
        run: |
          python -m pip install --upgrade pip
          python -m pip install ".[dev]"

      - name: Authenticate the candidate suite and record its identity
        run: >-
          python .github/scripts/candidate_suite.py record
          --checkout "${{ github.workspace }}/protocol-spec-candidate"
          --root "${{ github.workspace }}/protocol-spec-candidate/conformance/v1"
          --evidence candidate-suite-identity.txt

      - name: Require the candidate root to serve every declared consumer
        run: >-
          python .github/scripts/candidate_consumption.py require
          --root "${{ github.workspace }}/protocol-spec-candidate/conformance/v1"

      - name: Run the schema-8 candidate consumption suite
        env:
          CURATOR_CONFORMANCE_ROOT: ${{ github.workspace }}/protocol-spec-candidate/conformance/v1
          CSK_REQUIRE_FULL_CANDIDATE_ROOT: "1"
        run: >-
          python -m pytest -q tests/test_schema8_candidate_conformance.py
          --basetemp="${{ runner.temp }}/csk-schema8"
          --junitxml=csk-schema8-results.xml

      - name: Gate the declared schema-8 consumption cases
        run: >-
          python .github/scripts/candidate_consumption.py gate
          --results csk-schema8-results.xml
          --platform "${{ runner.os == 'Linux' && 'linux' || runner.os == 'macOS' && 'darwin' || 'windows' }}"

      - name: Collect Go E2E smoke node IDs
        env:
          CURATOR_CONFORMANCE_ROOT: ${{ github.workspace }}/protocol-spec-candidate/conformance/v1
          CSK_GO_V1_MANAGER_EXECUTABLE: csk
          CSK_GO_V1_GO_EXECUTABLE: go
          CSK_E2E_REQUIRED_PLATFORM: ${{ runner.os == 'macOS' && 'macos_native' || runner.os == 'Windows' && 'windows_native' || 'ubuntu_portable_fail_closed' }}
        run: >-
          python -m pytest --collect-only -q
          "@.github/ci/${{ runner.os == 'Linux' && 'go-e2e-ubuntu-smoke-nodeids.txt' || runner.os == 'macOS' && 'go-e2e-macos-worker-domain-nodeids.txt' || 'go-e2e-native-smoke-nodeids.txt' }}"
          -m "${{ runner.os == 'Linux' && 'csk_e2e_ubuntu' || 'csk_e2e_native' }}"
          > csk-e2e-smoke-nodeids.txt

      - name: Run Go E2E smoke selection
        env:
          CURATOR_CONFORMANCE_ROOT: ${{ github.workspace }}/protocol-spec-candidate/conformance/v1
          CSK_GO_V1_MANAGER_EXECUTABLE: csk
          CSK_GO_V1_GO_EXECUTABLE: go
          CSK_E2E_REQUIRED_PLATFORM: ${{ runner.os == 'macOS' && 'macos_native' || runner.os == 'Windows' && 'windows_native' || 'ubuntu_portable_fail_closed' }}
        run: >-
          python -m pytest -q
          "@.github/ci/${{ runner.os == 'Linux' && 'go-e2e-ubuntu-smoke-nodeids.txt' || runner.os == 'macOS' && 'go-e2e-macos-worker-domain-nodeids.txt' || 'go-e2e-native-smoke-nodeids.txt' }}"
          -m "${{ runner.os == 'Linux' && 'csk_e2e_ubuntu' || 'csk_e2e_native' }}"
          --basetemp="${{ runner.temp }}/csk-e2e-smoke"
          --junitxml=csk-e2e-smoke-results.xml

      - name: Upload Go E2E smoke evidence
        uses: actions/upload-artifact@v4
        with:
          name: csk-e2e-smoke-${{ matrix.os }}-py314
          path: |
            candidate-suite-identity.txt
            csk-schema8-results.xml
            csk-e2e-smoke-nodeids.txt
            csk-e2e-smoke-results.xml
          if-no-files-found: error

  fast:
    name: fast
    if: ${{ always() && github.event_name == 'pull_request' }}
    needs: [typecheck, build, fast_ordinary, fast_protocol, fast_go_e2e]
    runs-on: ubuntu-latest
    steps:
      - name: Require every fast child
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: |
          python - <<'PY'
          import json
          import os

          expected = {"typecheck", "build", "fast_ordinary", "fast_protocol", "fast_go_e2e"}
          actual = json.loads(os.environ["NEEDS_JSON"])
          if set(actual) != expected:
              raise SystemExit(f"required CI child mismatch: expected={sorted(expected)} actual={sorted(actual)}")
          bad = {name: value.get("result") for name, value in actual.items() if value.get("result") != "success"}
          if bad:
              raise SystemExit(f"required CI children did not succeed: {bad}")
          PY

  merge_ordinary:
    name: Merge ordinary / Python ${{ matrix.python-version }} on ${{ matrix.os }}
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Checkout Curator Protocol conformance suite
        uses: actions/checkout@v4
        with:
          repository: relux-works/curator-spec
          ref: ${{ env.RELEASED_SUITE_PIN }}
          path: protocol-spec

      - name: Set up Go 1.25.5
        uses: actions/setup-go@v7
        with:
          go-version: "1.25.5"
          cache: false

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          allow-prereleases: true

      - name: Configure git (POSIX)
        if: runner.os != 'Windows'
        run: |
          git config --global user.email "ci@example.com"
          git config --global user.name "CI"
          git config --global init.defaultBranch main

      - name: Configure git (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          git config --global user.email "ci@example.com"
          git config --global user.name "CI"
          git config --global init.defaultBranch main
          git config --global core.autocrlf false
          git config --global core.symlinks false

      - name: Install package
        run: |
          python -m pip install --upgrade pip
          python -m pip install ".[dev]"

      - name: Run full ordinary tests
        env:
          CURATOR_CONFORMANCE_ROOT: ${{ github.workspace }}/protocol-spec/conformance/v1
        run: >-
          python -m pytest -v
          --ignore=tests/test_protocol_conformance.py
          --ignore=tests/test_go_build_e2e.py
          -n 4 --dist=loadfile
          --basetemp="${{ runner.temp }}/csk-ordinary"
          -o cache_dir="${{ runner.temp }}/csk-pytest-cache"

  merge_protocol:
    name: Merge protocol / Python 3.14 / ${{ matrix.label }}
    # Reachable through workflow_dispatch as well, so the fail-closed shard
    # verifier can be exercised on a branch before the change is merged. It runs
    # nowhere else, and drift in an audited file used to surface only after a
    # push to main had already turned it red.
    if: >-
      (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
      github.event_name == 'workflow_dispatch'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            label: ubuntu-full
            shard: full
            temp_tag: full
            timeout_minutes: 360
          - os: macos-latest
            label: macos-full
            shard: full
            temp_tag: full
            timeout_minutes: 360
          - os: windows-latest
            label: windows-p00-contract-and-registry
            shard: p00-contract-and-registry
            temp_tag: p00
            timeout_minutes: 5
          - os: windows-latest
            label: windows-p01-lifecycle-cached-baseline
            shard: p01-lifecycle-cached-baseline
            temp_tag: p01
            timeout_minutes: 30
          - os: windows-latest
            label: windows-p02-lifecycle-sabotage-a
            shard: p02-lifecycle-sabotage-a
            temp_tag: p02
            timeout_minutes: 45
          - os: windows-latest
            label: windows-p03-lifecycle-sabotage-b
            shard: p03-lifecycle-sabotage-b
            temp_tag: p03
            timeout_minutes: 45
          - os: windows-latest
            label: windows-p04-lifecycle-sabotage-c
            shard: p04-lifecycle-sabotage-c
            temp_tag: p04
            timeout_minutes: 45
          - os: windows-latest
            label: windows-p05-lifecycle-sabotage-d
            shard: p05-lifecycle-sabotage-d
            temp_tag: p05
            timeout_minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Checkout Curator Protocol conformance suite
        uses: actions/checkout@v4
        with:
          repository: relux-works/curator-spec
          ref: ${{ env.RELEASED_SUITE_PIN }}
          path: protocol-spec

      - name: Set up Go 1.25.5
        uses: actions/setup-go@v7
        with:
          go-version: "1.25.5"
          cache: false

      - name: Set up Python 3.14
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          allow-prereleases: true

      - name: Configure git (POSIX)
        if: runner.os != 'Windows'
        run: |
          git config --global user.email "ci@example.com"
          git config --global user.name "CI"
          git config --global init.defaultBranch main

      - name: Configure git (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          git config --global user.email "ci@example.com"
          git config --global user.name "CI"
          git config --global init.defaultBranch main
          git config --global core.autocrlf false
          git config --global core.symlinks false

      - name: Normalize Windows source checkout
        if: runner.os == 'Windows'
        shell: pwsh
        # Checkout runs before the final Windows git policy is applied. Rewrite
        # tracked bytes under that policy so checkout-time CRLF conversions do
        # not make the pristine commit appear dirty to the fail-closed verifier.
        run: git reset --hard HEAD

      - name: Install package
        run: |
          python -m pip install --upgrade pip
          python -m pip install ".[dev]"

      - name: Relocate Windows protocol checkout and create evidence directory
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Move-Item -LiteralPath "${{ github.workspace }}/protocol-spec" -Destination "${{ runner.temp }}/protocol-spec"
          New-Item -ItemType Directory -Force -Path "${{ runner.temp }}/protocol-${{ matrix.temp_tag }}" | Out-Null

      - name: Run full protocol conformance suite
        if: runner.os != 'Windows'
        timeout-minutes: ${{ matrix.timeout_minutes }}
        env:
          CURATOR_CONFORMANCE_ROOT: ${{ github.workspace }}/protocol-spec/conformance/v1
        run: >-
          python -m pytest -v tests/test_protocol_conformance.py
          --basetemp="${{ runner.temp }}/csk-protocol-full"
          -o cache_dir="${{ runner.temp }}/csk-protocol-full-cache"

      - name: Collect canonical Windows protocol inventory
        if: runner.os == 'Windows'
        env:
          CURATOR_CONFORMANCE_ROOT: ${{ runner.temp }}/protocol-spec/conformance/v1
        run: >-
          python -m pytest --collect-only -q tests/test_protocol_conformance.py
          > "${{ runner.temp }}/protocol-${{ matrix.temp_tag }}/collected-nodeids.txt"

      - name: Verify and select deterministic Windows protocol shard
        if: runner.os == 'Windows'
        run: >-
          python .research/TASK-260803-2ol7ok_verify-protocol-shards.py
          --classification .research/TASK-260803-2ol7ok_protocol-isolation-classification.json
          --manifest .research/TASK-260803-2ol7ok_protocol-shards.json
          --collected "${{ runner.temp }}/protocol-${{ matrix.temp_tag }}/collected-nodeids.txt"
          --source-checkout .
          --protocol-checkout "${{ runner.temp }}/protocol-spec"
          --shard-id "${{ matrix.shard }}"
          --nodeids-out "${{ runner.temp }}/protocol-${{ matrix.temp_tag }}/shard-nodeids.txt"
          > "${{ runner.temp }}/protocol-${{ matrix.temp_tag }}/verification.json"

      - name: Run deterministic Windows protocol shard
        if: runner.os == 'Windows'
        timeout-minutes: ${{ matrix.timeout_minutes }}
        env:
          CURATOR_CONFORMANCE_ROOT: ${{ runner.temp }}/protocol-spec/conformance/v1
        run: >-
          python -m pytest -vv "@${{ runner.temp }}/protocol-${{ matrix.temp_tag }}/shard-nodeids.txt"
          --basetemp="${{ runner.temp }}/csk-${{ matrix.temp_tag }}"
          -o cache_dir="${{ runner.temp }}/csk-cache-${{ matrix.temp_tag }}"
          --junitxml="${{ runner.temp }}/protocol-${{ matrix.temp_tag }}/results.xml"

      - name: Upload Windows protocol shard evidence
        if: ${{ always() && runner.os == 'Windows' }}
        uses: actions/upload-artifact@v4
        with:
          name: protocol-${{ matrix.shard }}-windows-py314
          path: |
            ${{ runner.temp }}/protocol-${{ matrix.temp_tag }}/collected-nodeids.txt
            ${{ runner.temp }}/protocol-${{ matrix.temp_tag }}/shard-nodeids.txt
            ${{ runner.temp }}/protocol-${{ matrix.temp_tag }}/verification.json
            ${{ runner.temp }}/protocol-${{ matrix.temp_tag }}/results.xml
          if-no-files-found: error

  merge_go_e2e:
    name: Merge Go E2E / Python 3.14 on ${{ matrix.os }}
    if: >-
      (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
      github.event_name == 'workflow_dispatch'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    env:
      # The candidate identity every step of this job reads: the resolver, the
      # authenticator and the pytest fixture that re-authenticates the root.
      # Empty on push and pull_request, where the committed declaration in
      # .github/ci/candidate-suite.json is the candidate.
      CANDIDATE_REF: ${{ inputs.candidate_ref }}
      CANDIDATE_MANIFEST_SHA256: ${{ inputs.candidate_manifest_sha256 }}
      CANDIDATE_PROTOCOL_VERSION: ${{ inputs.candidate_protocol_version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go 1.25.5
        uses: actions/setup-go@v7
        with:
          go-version: "1.25.5"
          cache: false

      - name: Set up Python 3.14
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          allow-prereleases: true

      - name: Resolve the candidate suite input
        id: candidate
        run: python .github/scripts/candidate_suite.py resolve

      - name: Checkout the resolved candidate suite
        uses: actions/checkout@v4
        with:
          repository: ${{ steps.candidate.outputs.repository }}
          ref: ${{ steps.candidate.outputs.revision }}
          path: protocol-spec-candidate

      - name: Configure git (POSIX)
        if: runner.os != 'Windows'
        run: |
          git config --global user.email "ci@example.com"
          git config --global user.name "CI"
          git config --global init.defaultBranch main

      - name: Configure git (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          git config --global user.email "ci@example.com"
          git config --global user.name "CI"
          git config --global init.defaultBranch main
          git config --global core.autocrlf false
          git config --global core.symlinks false

      - name: Install package
        run: |
          python -m pip install --upgrade pip
          python -m pip install ".[dev]"

      - name: Authenticate the candidate suite and record its identity
        run: >-
          python .github/scripts/candidate_suite.py record
          --checkout "${{ github.workspace }}/protocol-spec-candidate"
          --root "${{ github.workspace }}/protocol-spec-candidate/conformance/v1"
          --evidence candidate-suite-identity.txt

      - name: Require the candidate root to serve every declared consumer
        run: >-
          python .github/scripts/candidate_consumption.py require
          --root "${{ github.workspace }}/protocol-spec-candidate/conformance/v1"

      - name: Run the schema-8 candidate consumption suite
        env:
          CURATOR_CONFORMANCE_ROOT: ${{ github.workspace }}/protocol-spec-candidate/conformance/v1
          CSK_REQUIRE_FULL_CANDIDATE_ROOT: "1"
        run: >-
          python -m pytest -q tests/test_schema8_candidate_conformance.py
          --basetemp="${{ runner.temp }}/csk-schema8"
          --junitxml=csk-schema8-results.xml

      - name: Gate the declared schema-8 consumption cases
        run: >-
          python .github/scripts/candidate_consumption.py gate
          --results csk-schema8-results.xml
          --platform "${{ runner.os == 'Linux' && 'linux' || runner.os == 'macOS' && 'darwin' || 'windows' }}"

      - name: Collect accepted Go E2E node IDs
        env:
          CURATOR_CONFORMANCE_ROOT: ${{ github.workspace }}/protocol-spec-candidate/conformance/v1
          CSK_GO_V1_MANAGER_EXECUTABLE: csk
          CSK_GO_V1_GO_EXECUTABLE: go
          CSK_E2E_REQUIRED_PLATFORM: ${{ runner.os == 'macOS' && 'macos_native' || runner.os == 'Windows' && 'windows_native' || 'ubuntu_portable_fail_closed' }}
        run: >-
          python -m pytest --collect-only -q tests/test_go_build_e2e.py
          -m "${{ runner.os == 'Linux' && 'csk_e2e_ubuntu' || 'csk_e2e_native' }}"
          > csk-e2e-nodeids.txt

      - name: Run accepted Go E2E selection
        env:
          CURATOR_CONFORMANCE_ROOT: ${{ github.workspace }}/protocol-spec-candidate/conformance/v1
          CSK_GO_V1_MANAGER_EXECUTABLE: csk
          CSK_GO_V1_GO_EXECUTABLE: go
          CSK_E2E_REQUIRED_PLATFORM: ${{ runner.os == 'macOS' && 'macos_native' || runner.os == 'Windows' && 'windows_native' || 'ubuntu_portable_fail_closed' }}
        run: >-
          python -m pytest -q tests/test_go_build_e2e.py
          -m "${{ runner.os == 'Linux' && 'csk_e2e_ubuntu' || 'csk_e2e_native' }}"
          --basetemp="${{ runner.temp }}/csk-e2e"
          --junitxml=csk-e2e-results.xml

      - name: Upload accepted Go E2E evidence
        uses: actions/upload-artifact@v4
        with:
          name: csk-e2e-${{ matrix.os }}-py314
          path: |
            candidate-suite-identity.txt
            csk-schema8-results.xml
            csk-e2e-nodeids.txt
            csk-e2e-results.xml
          if-no-files-found: error

  merge:
    name: merge
    if: ${{ always() && github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    needs: [typecheck, build, merge_ordinary, merge_protocol, merge_go_e2e]
    runs-on: ubuntu-latest
    steps:
      - name: Require every merge child
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: |
          python - <<'PY'
          import json
          import os

          expected = {"typecheck", "build", "merge_ordinary", "merge_protocol", "merge_go_e2e"}
          actual = json.loads(os.environ["NEEDS_JSON"])
          if set(actual) != expected:
              raise SystemExit(f"required CI child mismatch: expected={sorted(expected)} actual={sorted(actual)}")
          bad = {name: value.get("result") for name, value in actual.items() if value.get("result") != "success"}
          if bad:
              raise SystemExit(f"required CI children did not succeed: {bad}")
          PY
